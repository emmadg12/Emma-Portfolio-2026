<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emma — Accueil noir</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f4f2ee;--dim:rgba(244,242,238,.55);--sans:'Inter Tight',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Instrument Serif',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
body.fine,body.fine *{cursor:none}
#cur{position:fixed;left:0;top:0;width:30px;height:30px;z-index:50;pointer-events:none;display:none}
body.fine #cur{display:block}
/* grain */
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:40;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top,0px)) 4vw 0;z-index:10}
.logo{font-family:var(--serif);font-style:italic;font-size:26px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim)}
main{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.6vh,40px);padding:110px 16px 40px;text-align:center}
h1{font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.92;font-size:clamp(30px,min(8vw,8vh),104px)}
h1 span{display:block;transition:filter .45s,opacity .45s;opacity:0;transform:translateY(30px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .15s)}
@keyframes rise{to{opacity:1;transform:none}}
h1 .fun{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;font-size:1.08em}
/* carrousel */
.deck{position:relative;width:min(640px,100%);height:clamp(130px,23vh,210px);margin-top:clamp(10px,3vh,34px);perspective:1100px;opacity:0;animation:rise 1s ease .8s forwards;transform:translateY(30px)}
.card{position:absolute;left:50%;top:50%;width:clamp(84px,15vh,140px);aspect-ratio:1;margin:calc(clamp(84px,15vh,140px)/-2) 0 0 calc(clamp(84px,15vh,140px)/-2);border-radius:22px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.8);transition:transform .9s cubic-bezier(.65,0,.25,1),opacity .9s,filter .9s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:var(--g)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%)}
.card b{position:relative;z-index:1;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(12px,2vh,19px);line-height:1;padding:0 10px}
.card em{position:absolute;z-index:1;bottom:12px;left:0;right:0;font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;opacity:.7}
.sub{font-weight:500;font-size:clamp(20px,3.4vh,32px);letter-spacing:-.01em;opacity:0;animation:rise .9s ease 1.05s forwards;transform:translateY(30px)}
.sub i{font-family:var(--serif);font-weight:400}
.go{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:60px;padding:6px 6px 6px 18px;font-weight:800;font-size:12px;letter-spacing:.1em;opacity:0;animation:rise .9s ease 1.2s forwards;transform:translateY(30px);transition:transform .25s}
.go s{text-decoration:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--fg);font-size:12px;transition:transform .35s}
.go:hover s{transform:rotate(-45deg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span,.deck,.sub,.go{opacity:1;transform:none}}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:clamp(22px,4vw,48px);padding:calc(26px + env(safe-area-inset-top,0px)) 16px 0;font-family:var(--serif);font-style:italic;font-size:clamp(19px,2.6vh,24px)}
.top a{position:relative;opacity:0;animation:rise .8s ease .1s forwards;transform:translateY(-10px)}
.top a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.top a:hover::after{transform:scaleX(1)}
.top sup{font-family:var(--sans);font-style:normal;font-size:.55em;margin-left:4px;vertical-align:.5em}
</style>
</head>
<body>
<div id="cur"><svg viewBox="0 0 28 28" width="30" height="30"><circle cx="14" cy="14" r="11" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="10" cy="12" r="1.4" fill="#fff"/><circle cx="18" cy="12" r="1.4" fill="#fff"/><path d="M9 17Q14 21 19 17" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
<nav class="top"><a href="../index.html#about">About me<sup>↗</sup></a><a href="../index.html#contact">Contact me<sup>↗</sup></a></nav>
<main>
  <h1>
    <span style="--i:0">Emma Di Gesaro</span>
    <span style="--i:1">Social Media Strategist</span>
    <span style="--i:2">Copywriter</span>
    <span style="--i:3">Fun colleague</span>
    <span style="--i:4">Humble.</span>
  </h1>
  <div class="deck" id="deck">
    <div class="card" style="--g:linear-gradient(140deg,#1d3fd6,#0b1450)"><b>Rexona</b></div>
    <div class="card" style="--g:linear-gradient(140deg,#13204a,#c8102e)"><b>Air France</b></div>
    <div class="card" style="--g:linear-gradient(140deg,#ff7a1a,#0a3d91)"><b>EDF</b></div>
    <div class="card" style="--g:linear-gradient(140deg,#e4002b,#5a0014)"><b>Shiseido</b></div>
    <div class="card" style="--g:linear-gradient(140deg,#8fc9e8,#2a6f9c)"><b>Avène</b></div>
  </div>
  <p class="sub">Discover my <i>work</i></p>
  <a class="go" href="../index.html">GO <s>→</s></a>
</main>
<script>
const cards=[...document.querySelectorAll('.card')],n=cards.length;let k=0;
function place(){const step=cards[0].offsetWidth*.78;
  cards.forEach((c,i)=>{let d=((i-k)%n+n)%n;if(d>n/2)d-=n;const a=Math.abs(d);const jump=c._d!==undefined&&Math.abs(d-c._d)>1;c._d=d;c.style.transition=jump?'none':'';
    c.style.transform=`translateX(${d*step}px) translateY(${a*a*10-12}px) scale(${1-a*.1})`;
    c.style.zIndex=10-a;c.style.opacity=a>2?0:1;c.style.filter=a?`brightness(${1-a*.28})`:'none';if(jump){c.offsetWidth;c.style.transition=''}})}
place();addEventListener('resize',place);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{k=(k+1)%n;place()},2200);
if(matchMedia('(hover:hover) and (pointer:fine)').matches){document.body.classList.add('fine');
  let mx=innerWidth/2,my=innerHeight/2,x=mx,y=my;const c=document.getElementById('cur');
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
  (function l(){x+=(mx-x)*.22;y+=(my-y)*.22;c.style.transform=`translate(${x-15}px,${y-15}px)`;requestAnimationFrame(l)})()}
</script>
</body>
</html>
