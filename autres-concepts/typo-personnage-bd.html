:root{--bg:#f4efe7;--red:#e0352b;--sans:'Inter Tight',system-ui,sans-serif;--cond:'AntonioE','Arial Narrow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--red);font-family:var(--sans);overflow:hidden}
main{height:100vh;height:100svh;display:grid;place-items:center;padding:10vh 16px 16px}
.wrap{--f:min(12vw,24vh);--c:.48em;--o:.47em;--g:1.75em;--h:.86em;--rg:.08em;position:relative;font-size:var(--f)}
.meta{display:flex;align-items:center;gap:.7em;font-size:max(10px,calc(var(--f)*.085));letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;font-weight:600}
.meta i{flex:1;height:1.5px;background:var(--red);position:relative;transform:scaleX(0);animation:line 1s cubic-bezier(.6,0,.2,1) forwards 1.2s}
.meta i::before,.meta i::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--red)}
.meta i::before{left:0}.meta i::after{right:0}
.meta span{opacity:0;animation:fade .8s ease forwards 1.4s}
.meta.t{margin-bottom:.3em}.meta.b{margin-top:.3em}
@keyframes line{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
.type{position:relative;font-family:var(--cond);font-weight:600;text-transform:uppercase}
.row{display:flex;height:var(--h);line-height:.71em}
.row+.row{margin-top:var(--rg)}
.row b{display:block;height:var(--h);padding:0 .05em;text-align:center;font-weight:inherit;opacity:0;transform:translateY(.35em);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d)*.05s + .15s)}
.row b.gap{width:var(--g);padding:0}.row b:first-child{width:var(--c);padding:0}.row b.slot{width:calc(var(--o) + .1em)}
.row b.slot,.row b.gap{animation:none}
@keyframes up{to{opacity:1;transform:none}}
.tallO{position:absolute;left:calc(var(--c) + .05em);top:0;width:var(--o);height:calc(var(--h)*2 + var(--rg));border:.118em solid var(--red);border-radius:999px;transform-origin:top;transform:scaleY(0);animation:tall 1.1s cubic-bezier(.2,.8,.2,1) forwards .2s}
@keyframes tall{to{transform:scaleY(1)}}
.me{position:absolute;bottom:0;left:var(--mx,50%);height:calc(var(--h)*3.25);transform:translate(-50%,30%);opacity:0;animation:pop 1s cubic-bezier(.3,1.5,.45,1) forwards .7s;z-index:2}
.me img{height:100%;display:block;transform-origin:50% 100%}
.me:hover img{animation:wave .7s ease-in-out}
@keyframes pop{to{opacity:1;transform:translate(-50%,0)}}
@keyframes wave{30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.row b,.meta span,.me,.tallO{opacity:1;transform:none}.tallO{transform:none}.me{transform:translate(-50%,0)}.meta i{transform:none}}
</style>
